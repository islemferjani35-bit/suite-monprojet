<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Réservation - Fast Food</title>
    <link rel="stylesheet" href="css/hh.css">
</head>
<body id="réservée">
<div class="reservation">
<h1>Customer Information</h1>
<img src="images/logo de restaurant.JPG" height="100px">
<h1>Réserver une table</h1>
<p>Remplissez le formulaire pour réserver votre table.</p>

<form>
<label>Nom :</label>
<input type="text" placeholder="Votre nom">
<br>

<label>Email :</label>
<input type="email" placeholder="Votre email">
<br>

<label>Téléphone :</label>
<input type="tel" placeholder="Votre numéro">
<br>

<label>Date :</label>
<input type="date">
<br>

<label>Heure :</label>
<input type="time">
<br>

<label>Nombre de personnes :</label>
<select>
                <option>1 personne</option>
                <option>2 personnes</option>
                <option>3 personnes</option>
                <option>4 personnes</option>
                <option>5 personnes</option>
                <option>6 personnes ou plus</option>
</select>
<br>

<label>Message :</label>
<textarea placeholder="Une remarque ?"></textarea>
<br>
<button type="submit">Réserver</button>
</form>
</div>
</body>
</html>
